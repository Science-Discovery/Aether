name: review

on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: |
      github.event.issue.pull_request &&
      (
        github.event.comment.body == '/oc review' ||
        github.event.comment.body == '/opencode review'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check team membership
        id: team
        env:
          LOGIN: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail

          if grep -qxF "$LOGIN" .github/TEAM_MEMBERS; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "allowed=false" >> "$GITHUB_OUTPUT"
          echo "Skipping review: $LOGIN is not listed in .github/TEAM_MEMBERS"

      - name: Validate review configuration
        if: steps.team.outputs.allowed == 'true'
        env:
          REVIEW_LLM_API_KEY: ${{ secrets.REVIEW_LLM_API_KEY }}
          REVIEW_LLM_BASE_URL: ${{ vars.REVIEW_LLM_BASE_URL }}
          REVIEW_LLM_MODEL: ${{ vars.REVIEW_LLM_MODEL }}
        run: |
          set -euo pipefail

          missing=()
          if [ -z "${REVIEW_LLM_API_KEY:-}" ]; then
            missing+=("REVIEW_LLM_API_KEY")
          fi
          if [ -z "${REVIEW_LLM_BASE_URL:-}" ]; then
            missing+=("REVIEW_LLM_BASE_URL")
          fi
          if [ -z "${REVIEW_LLM_MODEL:-}" ]; then
            missing+=("REVIEW_LLM_MODEL")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing review LLM configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install opencode
        if: steps.team.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Build review prompt
        if: steps.team.outputs.allowed == 'true'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail

          cp .github/prompts/review.txt review-prompt.txt

          cat <<EOF >> review-prompt.txt

          <review_context>
          repository: ${REPOSITORY}
          pr_number: ${PR_NUMBER}
          trigger_comment: ${COMMENT_BODY}
          trigger_author: ${COMMENT_AUTHOR}
          </review_context>
          EOF

      - name: Run opencode review
        if: steps.team.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_LLM_API_KEY: ${{ secrets.REVIEW_LLM_API_KEY }}
          REVIEW_LLM_BASE_URL: ${{ vars.REVIEW_LLM_BASE_URL }}
          REVIEW_LLM_MODEL: ${{ vars.REVIEW_LLM_MODEL }}
          OPENCODE_CONFIG_CONTENT: >-
            {"$schema":"https://opencode.ai/config.json","enabled_providers":["review"],"provider":{"review":{"name":"Review Provider","npm":"@ai-sdk/openai-compatible","env":[],"models":{"primary":{"id":"{env:REVIEW_LLM_MODEL}","name":"Review Primary","tool_call":true,"limit":{"context":128000,"output":8192}}},"options":{"apiKey":"{env:REVIEW_LLM_API_KEY}","baseURL":"{env:REVIEW_LLM_BASE_URL}"}}},"agent":{"review":{"mode":"primary","description":"Restricted PR review agent for GitHub Actions","steps":64,"permission":{"*":"deny","bash":{"*":"deny","gh pr view *":"allow","gh pr diff *":"allow","gh api *pulls*":"allow","gh api *contents*":"allow","gh api *comments*":"deny","gh api *reviews*":"deny","gh api *--method*":"deny","gh api *-X*":"deny","gh api graphql*":"deny","gh pr comment *":"deny"},"task":{"explore":"allow"},"read":"allow","grep":"allow","glob":"allow","list":"allow"}},"explore":{"permission":{"bash":{"*":"deny","gh pr view *":"allow","gh pr diff *":"allow","gh api *pulls*":"allow","gh api *contents*":"allow"},"external_directory":{"*":"deny"}}}}}
        run: |
          set -euo pipefail

          opencode run \
            --agent review \
            --model review/primary \
            --format json \
            < review-prompt.txt \
            > review-events.jsonl

          node .github/scripts/extract-opencode-comment.mjs review-events.jsonl > review-comment.md

      - name: Post review comment
        if: steps.team.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file review-comment.md
