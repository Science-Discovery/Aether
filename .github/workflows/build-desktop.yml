name: build-desktop
# 手动触发：在 GitHub 仓库页面 Actions → build-desktop → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 第一步：构建 CLI 二进制（所有平台） ──────────────────────────────
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Build CLI
        run: ./packages/opencode/script/build.ts --skip-install
        env:
          OPENCODE_RELEASE: ""

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

  # ── 第二步：构建 Tauri 桌面安装包（各平台并行） ──────────────────────
  build-tauri:
    needs: build-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: ${{ matrix.target }}

      - uses: actions/download-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

      # 将对应平台的 CLI 复制到 sidecar 目录
      - name: Prepare sidecar
        shell: bash
        run: |
          mkdir -p packages/desktop/src-tauri/sidecars
          TARGET="${{ matrix.target }}"

          if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
            SRC="packages/opencode/dist/opencode-windows-x64-baseline/bin/opencode.exe"
            DEST="packages/desktop/src-tauri/sidecars/opencode-cli-${TARGET}.exe"
          elif [[ "$TARGET" == "aarch64-apple-darwin" ]]; then
            SRC="packages/opencode/dist/opencode-darwin-arm64/bin/opencode"
            DEST="packages/desktop/src-tauri/sidecars/opencode-cli-${TARGET}"
          elif [[ "$TARGET" == "x86_64-apple-darwin" ]]; then
            SRC="packages/opencode/dist/opencode-darwin-x64-baseline/bin/opencode"
            DEST="packages/desktop/src-tauri/sidecars/opencode-cli-${TARGET}"
          elif [[ "$TARGET" == "x86_64-unknown-linux-gnu" ]]; then
            SRC="packages/opencode/dist/opencode-linux-x64-baseline/bin/opencode"
            DEST="packages/desktop/src-tauri/sidecars/opencode-cli-${TARGET}"
          fi

          cp "$SRC" "$DEST"
          chmod +x "$DEST" || true

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: packages/desktop
          args: --target ${{ matrix.target }} --config ./src-tauri/tauri.prod.conf.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.target }}
          path: |
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe

  # ── 第二步（可选）：构建 Electron 桌面安装包 ──────────────────────────
  build-electron:
    needs: build-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_flag: --linux
          - host: macos-latest
            target: aarch64-apple-darwin
            platform_flag: --mac --arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            platform_flag: --mac --x64
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            platform_flag: --win
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - uses: actions/download-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

      # 将对应平台的 CLI 复制到 resources 目录
      - name: Prepare sidecar
        shell: bash
        run: |
          mkdir -p packages/desktop-electron/resources
          TARGET="${{ matrix.target }}"

          if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
            cp packages/opencode/dist/opencode-windows-x64-baseline/bin/opencode.exe \
               packages/desktop-electron/resources/opencode-cli.exe
          elif [[ "$TARGET" == "aarch64-apple-darwin" ]]; then
            cp packages/opencode/dist/opencode-darwin-arm64/bin/opencode \
               packages/desktop-electron/resources/opencode-cli
          elif [[ "$TARGET" == "x86_64-apple-darwin" ]]; then
            cp packages/opencode/dist/opencode-darwin-x64-baseline/bin/opencode \
               packages/desktop-electron/resources/opencode-cli
          elif [[ "$TARGET" == "x86_64-unknown-linux-gnu" ]]; then
            cp packages/opencode/dist/opencode-linux-x64-baseline/bin/opencode \
               packages/desktop-electron/resources/opencode-cli
          fi

          chmod +x packages/desktop-electron/resources/opencode-cli || true

      - name: Build frontend
        run: bun run build
        working-directory: packages/desktop-electron

      - name: Package
        run: npx electron-builder ${{ matrix.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop-electron

      - uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.target }}
          path: packages/desktop-electron/dist/*
