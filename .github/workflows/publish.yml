name: publish
run-name: "release v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.3"
        required: true
        type: string
      release_electron:
        description: "Also build Electron artifacts"
        required: false
        default: false
        type: boolean
      upload_downloadbeta:
        description: "Upload web artifacts to downloadbeta"
        required: false
        default: false
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Science-Discovery/Aether'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${{ inputs.version }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --title "$tag" --draft --generate-notes
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

  build-electron:
    # Electron build stays available, but is opt-in via workflow_dispatch input.
    if: github.repository == 'Science-Discovery/Aether' && inputs.release_electron
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac
            host: macos-14
            rust_target: aarch64-apple-darwin
            flag: --mac --arm64
            files: |
              packages/desktop-electron/dist/*.dmg
              packages/desktop-electron/dist/*.zip
              packages/desktop-electron/dist/*.blockmap
          - id: mac-x64
            host: macos-15-intel
            rust_target: x86_64-apple-darwin
            flag: --mac --x64
            files: |
              packages/desktop-electron/dist/*.dmg
              packages/desktop-electron/dist/*.zip
              packages/desktop-electron/dist/*.blockmap
          - id: windows
            host: windows-2022
            rust_target: x86_64-pc-windows-msvc
            flag: --win
            files: |
              packages/desktop-electron/dist/*.exe
              packages/desktop-electron/dist/*.blockmap
          - id: windows-arm64
            host: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            flag: --win --arm64
            files: |
              packages/desktop-electron/dist/*.exe
              packages/desktop-electron/dist/*.blockmap
          - id: linux
            host: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            flag: --linux
            files: |
              packages/desktop-electron/dist/*.AppImage
              packages/desktop-electron/dist/*.deb
              packages/desktop-electron/dist/*.rpm
              packages/desktop-electron/dist/*.blockmap
          - id: linux-arm64
            host: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            flag: --linux --arm64
            files: |
              packages/desktop-electron/dist/*.AppImage
              packages/desktop-electron/dist/*.deb
              packages/desktop-electron/dist/*.rpm
              packages/desktop-electron/dist/*.blockmap
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build sidecar
        run: bun ./packages/opencode/script/build.ts --single --skip-install --skip-smoke
        env:
          OPENCODE_VERSION: ${{ needs.release.outputs.version }}
          OPENCODE_CHANNEL: prod
          RUST_TARGET: ${{ matrix.rust_target }}

      - name: Prepare Electron resources
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop-electron
        env:
          OPENCODE_VERSION: ${{ needs.release.outputs.version }}
          OPENCODE_CHANNEL: prod
          RUST_TARGET: ${{ matrix.rust_target }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}

      - name: Build Electron app
        run: bun run build
        working-directory: packages/desktop-electron
        env:
          OPENCODE_CHANNEL: prod

      - name: Package Electron app
        run: npx electron-builder ${{ matrix.flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop-electron
        env:
          OPENCODE_CHANNEL: prod
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Rename Linux arm64 update metadata
        if: matrix.id == 'linux-arm64'
        run: mv dist/latest-linux.yml dist/latest-linux-arm64.yml
        working-directory: packages/desktop-electron

      - name: Rename Windows arm64 update metadata
        if: matrix.id == 'windows-arm64'
        run: mv dist/latest.yml dist/latest-arm64.yml
        working-directory: packages/desktop-electron

      - uses: actions/upload-artifact@v4
        with:
          name: release-electron-${{ matrix.id }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: latest-yml-${{ matrix.rust_target }}
          path: packages/desktop-electron/dist/latest*.yml
          if-no-files-found: error

  build-web-mac:
    if: github.repository == 'Science-Discovery/Aether'
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            host: macos-14
            yml: latest-web-mac.yml
          - arch: x64
            host: macos-15-intel
            yml: latest-web-mac-x64.yml
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Package browser build for macOS
        run: ./packing_scripts/release-mac-web.sh ${{ needs.release.outputs.version }} ${{ matrix.arch }}
        env:
          OPENCODE_VERSION: ${{ needs.release.outputs.version }}
          OPENCODE_CHANNEL: prod

      - uses: actions/upload-artifact@v4
        with:
          name: release-web-mac-${{ matrix.arch }}
          path: |
            packages/opencode/dist/aether-darwin-${{ matrix.arch }}.dmg
            packages/opencode/dist/${{ matrix.yml }}
          if-no-files-found: error

  build-web-linux:
    if: github.repository == 'Science-Discovery/Aether'
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            host: ubuntu-24.04
            yml: latest-web-linux.yml
          - arch: arm64
            host: ubuntu-24.04-arm
            yml: latest-web-linux-arm64.yml
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Package browser build for Linux
        run: ./packing_scripts/release-linux-web.sh ${{ needs.release.outputs.version }} ${{ matrix.arch }}
        env:
          OPENCODE_VERSION: ${{ needs.release.outputs.version }}
          OPENCODE_CHANNEL: prod

      - uses: actions/upload-artifact@v4
        with:
          name: release-web-linux-${{ matrix.arch }}
          path: |
            packages/opencode/dist/aether-linux-${{ matrix.arch }}.zip
            packages/opencode/dist/${{ matrix.yml }}
          if-no-files-found: error

  build-web-windows:
    if: github.repository == 'Science-Discovery/Aether'
    needs: release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Package browser build for Windows
        run: packing_scripts\release-windows-web.bat ${{ needs.release.outputs.version }}
        shell: cmd
        env:
          OPENCODE_VERSION: ${{ needs.release.outputs.version }}
          OPENCODE_CHANNEL: prod

      - uses: actions/upload-artifact@v4
        with:
          name: release-web-windows
          path: |
            packages/opencode/dist/aether-windows-x64.zip
            packages/opencode/dist/latest-web-windows.yml
          if-no-files-found: error

  publish:
    if: >
      always() &&
      github.repository == 'Science-Discovery/Aether' &&
      needs.release.result == 'success' &&
      needs.build-web-mac.result == 'success' &&
      needs.build-web-linux.result == 'success' &&
      needs.build-web-windows.result == 'success' &&
      (!inputs.release_electron || needs.build-electron.result == 'success')
    needs:
      - release
      - build-electron
      - build-web-mac
      - build-web-linux
      - build-web-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
        if: inputs.upload_downloadbeta || inputs.release_electron

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t files < <(find dist -maxdepth 1 -type f | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found"
            exit 1
          fi

          gh release upload "${{ needs.release.outputs.tag }}" "${files[@]}" --clobber

      - uses: actions/download-artifact@v4
        if: inputs.release_electron
        with:
          pattern: latest-yml-*
          path: latest-yml

      - name: Finalize Electron update metadata
        if: inputs.release_electron
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST_YML_DIR: ${{ github.workspace }}/latest-yml
          OPENCODE_VERSION: ${{ needs.release.outputs.version }}
        run: bun packages/desktop-electron/scripts/finalize-latest-yml.ts

      - name: Upload web artifacts to downloadbeta
        if: inputs.upload_downloadbeta
        env:
          DOWNLOAD_BETA_BASE_URL: ${{ vars.DOWNLOAD_BETA_BASE_URL }}
          DOWNLOAD_ADMIN_PASSWORD: ${{ secrets.DOWNLOAD_ADMIN_PASSWORD }}
          DOWNLOAD_BETA_VERSION: ${{ needs.release.outputs.version }}
        run: bun .github/scripts/upload-downloadbeta.ts

      - name: Create release tag
        run: |
          tag="${{ needs.release.outputs.tag }}"
          sha="${{ github.sha }}"

          git fetch origin "refs/tags/$tag:refs/tags/$tag" || true

          if git rev-parse "$tag" >/dev/null 2>&1; then
            current="$(git rev-list -n 1 "$tag")"
            if [ "$current" != "$sha" ]; then
              echo "Tag $tag already points to $current, expected $sha"
              exit 1
            fi
            echo "Tag $tag already points to $sha"
            exit 0
          fi

          git tag "$tag" "$sha"
          git push origin "refs/tags/$tag"
