name: publish
run-name: "release v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.3"
        required: true
        type: string
      release_electron:
        description: "Also build Electron artifacts"
        required: false
        default: false
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Science-Discovery/Aether'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v${{ inputs.version }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --title "$tag" --draft --generate-notes
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

  build-electron:
    # Electron build stays available, but is opt-in via workflow_dispatch input.
    # To upload Electron artifacts again, also re-add build-electron under
    # publish.needs below.
    if: github.repository == 'Science-Discovery/Aether' && inputs.release_electron
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mac
            host: macos-14
            rust_target: aarch64-apple-darwin
            flag: --mac --arm64
            files: |
              packages/desktop-electron/dist/*.dmg
              packages/desktop-electron/dist/latest*.yml
              packages/desktop-electron/dist/*.blockmap
          - id: windows
            host: windows-2022
            rust_target: x86_64-pc-windows-msvc
            flag: --win
            files: |
              packages/desktop-electron/dist/*.exe
              packages/desktop-electron/dist/latest*.yml
              packages/desktop-electron/dist/*.blockmap
          - id: linux
            host: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            flag: --linux
            files: |
              packages/desktop-electron/dist/*.AppImage
              packages/desktop-electron/dist/*.deb
              packages/desktop-electron/dist/*.rpm
              packages/desktop-electron/dist/latest*.yml
              packages/desktop-electron/dist/*.blockmap
          - id: linux-arm64
            host: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            flag: --linux --arm64
            files: |
              packages/desktop-electron/dist/*.AppImage
              packages/desktop-electron/dist/*.deb
              packages/desktop-electron/dist/*.rpm
              packages/desktop-electron/dist/latest*.yml
              packages/desktop-electron/dist/*.blockmap
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build sidecar
        run: bun ./packages/opencode/script/build.ts --single --skip-install --skip-smoke
        env:
          OPENCODE_VERSION: ${{ needs.release.outputs.version }}
          OPENCODE_CHANNEL: prod

      - name: Prepare Electron resources
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop-electron
        env:
          OPENCODE_VERSION: ${{ needs.release.outputs.version }}
          OPENCODE_CHANNEL: prod
          RUST_TARGET: ${{ matrix.rust_target }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}

      - name: Build Electron app
        run: bun run build
        working-directory: packages/desktop-electron
        env:
          OPENCODE_CHANNEL: prod

      - name: Package Electron app
        run: npx electron-builder ${{ matrix.flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop-electron
        env:
          OPENCODE_CHANNEL: prod
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Rename Linux arm64 update metadata
        if: matrix.id == 'linux-arm64'
        run: mv dist/latest-linux.yml dist/latest-linux-arm64.yml
        working-directory: packages/desktop-electron

      - uses: actions/upload-artifact@v4
        with:
          name: release-electron-${{ matrix.id }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  build-web-mac:
    if: github.repository == 'Science-Discovery/Aether'
    needs: release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Package browser build for macOS
        run: ./packing_scripts/release-mac-web.sh ${{ needs.release.outputs.version }}
        env:
          OPENCODE_VERSION: ${{ needs.release.outputs.version }}
          OPENCODE_CHANNEL: prod

      - uses: actions/upload-artifact@v4
        with:
          name: release-web-mac
          path: |
            packages/opencode/dist/aether-darwin-arm64.dmg
            packages/opencode/dist/latest-web-mac.yml
          if-no-files-found: error

  build-web-linux:
    if: github.repository == 'Science-Discovery/Aether'
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            host: ubuntu-24.04
            yml: latest-web-linux.yml
          - arch: arm64
            host: ubuntu-24.04-arm
            yml: latest-web-linux-arm64.yml
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Package browser build for Linux
        run: ./packing_scripts/release-linux-web.sh ${{ needs.release.outputs.version }} ${{ matrix.arch }}
        env:
          OPENCODE_VERSION: ${{ needs.release.outputs.version }}
          OPENCODE_CHANNEL: prod

      - uses: actions/upload-artifact@v4
        with:
          name: release-web-linux-${{ matrix.arch }}
          path: |
            packages/opencode/dist/aether-linux-${{ matrix.arch }}.zip
            packages/opencode/dist/${{ matrix.yml }}
          if-no-files-found: error

  build-web-windows:
    if: github.repository == 'Science-Discovery/Aether'
    needs: release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Package browser build for Windows
        run: packing_scripts\release-windows-web.bat ${{ needs.release.outputs.version }}
        shell: cmd
        env:
          OPENCODE_VERSION: ${{ needs.release.outputs.version }}
          OPENCODE_CHANNEL: prod

      - uses: actions/upload-artifact@v4
        with:
          name: release-web-windows
          path: |
            packages/opencode/dist/aether-windows-x64.zip
            packages/opencode/dist/latest-web-windows.yml
          if-no-files-found: error

  publish:
    if: github.repository == 'Science-Discovery/Aether'
    needs:
      - release
      # Electron release artifacts are temporarily disabled in this workflow.
      # - build-electron
      - build-web-mac
      - build-web-linux
      - build-web-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t files < <(find dist -maxdepth 1 -type f | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found"
            exit 1
          fi

          gh release upload "${{ needs.release.outputs.tag }}" "${files[@]}" --clobber
