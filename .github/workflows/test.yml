name: test

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  ui-unit:
    name: ui unit (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run ui unit tests
        run: bun --cwd packages/ui test:unit

  ui-unit-windows:
    name: ui unit (windows)
    runs-on: windows-2022
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run ui unit tests
        run: bun --cwd packages/ui test:unit

  # First-layer CI: fast and currently stable app unit tests.
  app-unit:
    name: app unit (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Run app unit tests
        run: bun --cwd packages/app test:unit

  # Restore Windows coverage using the same hosted runner family already used by publish.yml.
  app-unit-windows:
    name: app unit (windows)
    runs-on: windows-2022
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Run app unit tests
        run: bun --cwd packages/app test:unit

  # Second-layer CI: keep core package tests visible even while they are still failing.
  # This is intentional: these failures represent real product/test issues, not runner noise.
  opencode-unit:
    name: opencode unit (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          echo "OPENCODE_RIPGREP_PATH=$(command -v rg)" >> "$GITHUB_ENV"

      - name: Run opencode unit tests
        working-directory: packages/opencode
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
        run: bun test --timeout 30000

  opencode-unit-windows:
    name: opencode unit (windows)
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup ripgrep
        shell: pwsh
        run: |
          $bin = Join-Path ($env:ChocolateyInstall ?? "C:\ProgramData\chocolatey") "bin"
          $env:Path = "$bin;$env:Path"

          if (-not (Get-Command rg.exe -CommandType Application -ErrorAction SilentlyContinue)) {
            choco install ripgrep -y --no-progress
            $env:Path = "$bin;$env:Path"
          }

          $rg = (Get-Command rg.exe -CommandType Application -ErrorAction Stop).Source
          "OPENCODE_RIPGREP_PATH=$rg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Run opencode unit tests
        working-directory: packages/opencode
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
        run: bun test --timeout 30000

  # App E2E is restored as its own job so runner/setup issues stay isolated from unit jobs.
  e2e:
    name: app e2e (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          - name: windows
            host: windows-2022
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./packages/app/package.json").devDependencies["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests
        working-directory: packages/app
        run: |
          specs=()
          while IFS= read -r line; do
            line="${line%%#*}"
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            if [ -n "$line" ]; then
              specs+=("$line")
            fi
          done < e2e/ci-specs.txt

          bun test:e2e:local "${specs[@]}"
        env:
          CI: true
          PLAYWRIGHT_JUNIT_OUTPUT: e2e/junit-${{ matrix.settings.name }}.xml

      - name: Run app e2e serial specs
        if: success()
        working-directory: packages/app
        run: |
          specs=()
          while IFS= read -r line; do
            line="${line%%#*}"
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            if [ -n "$line" ]; then
              specs+=("$line")
            fi
          done < e2e/ci-specs-serial.txt

          bun test:e2e:local --workers 1 "${specs[@]}"
        env:
          CI: true
          PLAYWRIGHT_JUNIT_OUTPUT: e2e/junit-${{ matrix.settings.name }}-serial.xml

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/junit-*.xml
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
