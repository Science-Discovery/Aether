version: 1
providers:
  - id: alibaba-cn
    name: DashScope / Alibaba Bailian
    type: openai-compatible
    npm: "@ai-sdk/openai-compatible"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_env: DASHSCOPE_API_KEY
    models:
      - id: qwen3.6-plus
        capabilities:
          reasoning: true
          temperature: true
          tool: true
          interleaved: reasoning_content
      - id: qwen3.6-flash
        capabilities:
          reasoning: true
          temperature: true
          tool: true
          interleaved: reasoning_content
      - id: qwen3.6-max-preview
        capabilities:
          reasoning: true
          temperature: true
          tool: true
          interleaved: reasoning_content
      - id: glm-5.1
        capabilities:
